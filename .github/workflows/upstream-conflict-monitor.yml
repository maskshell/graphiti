name: upstream-conflict-monitor
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-conflict-monitor
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'maskshell/graphiti'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.detect.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Detect upstream state
        id: detect
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          git remote add upstream https://github.com/getzep/graphiti.git
          git fetch --quiet upstream main
          git fetch --quiet origin main
          UP=$(git rev-parse upstream/main)
          TIP=$(git rev-parse origin/main)
          BASE=$(git merge-base "$UP" "$TIP")
          echo "up_head=$UP" >> "$GITHUB_OUTPUT"
          echo "tip_head=$TIP" >> "$GITHUB_OUTPUT"
          if [ "$UP" = "$BASE" ]; then
            echo "status=contained" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(git merge-tree --write-tree --name-only "$TIP" "$UP" || true)
          if [ -n "$OUT" ] && ! printf '%s' "$OUT" | grep -q '^CONFLICT'; then
            echo "status=clean-behind" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Conflict: file list = lines after the tree OID until the first blank line
          printf '%s\n' "$OUT" | sed -n '2,/^$/p' | sed '/^$/d' > /tmp/conflict_files.txt
          {
            echo 'status=conflict'
            echo "files<<EOF"
            cat /tmp/conflict_files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Reconcile tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.detect.outputs.status }}
          UP_HEAD: ${{ steps.detect.outputs.up_head }}
          FILES: ${{ steps.detect.outputs.files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'ops: upstream/main has conflicts with main (PR #1209)'
          LABEL: upstream-conflict
        run: |
          set -eu
          # Idempotent label (repo metadata; absent on fresh forks)
          gh label create "$LABEL" --color B60205 --description 'upstream conflict tracking' 2>/dev/null || true

          OPEN=$(gh issue list --label "$LABEL" --state open --json number --jq 'map(.number) | min // empty' || true)

          if [ "$STATUS" = conflict ]; then
            # Fingerprint: upstream head + sorted file set — comment only on change
            FP=$(printf '%s\n%s' "$UP_HEAD" "$FILES" | sort | shasum -a 256 | cut -c1-16)
            BODY="cc @${{ github.repository_owner }}
          Upstream head: \`${UP_HEAD}\`
          Fingerprint: \`${FP}\`
          Conflicting files:
          \`\`\`
          ${FILES:-unparsed — see run log}
          \`\`\`
          Run: ${RUN_URL}"
            if [ -z "$OPEN" ]; then
              gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL"
            else
              # Respect manual close: only the OPEN labeled issue is touched
              LAST_FP=$(gh issue view "$OPEN" --json body --jq '.body' | grep -o 'Fingerprint: `[^`]*`' | tail -1 | cut -d'`' -f2 || true)
              if [ "$LAST_FP" != "$FP" ]; then
                gh issue comment "$OPEN" --body "$BODY"
              fi
            fi
          elif [ -n "$OPEN" ]; then
            # conflict -> contained/clean-behind: close with resolution
            gh issue close "$OPEN" --comment "Resolved: status=${STATUS} at ${RUN_URL}"
          fi
