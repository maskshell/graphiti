name: upstream-conflict-monitor
on:
  schedule:
    - cron: '23 * * * *'  # hourly, offset to dodge GitHub top-of-hour load
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: github.repository == 'maskshell/graphiti'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test PR branch against upstream/main
        id: test
        run: |
          set -eu
          git remote add upstream https://github.com/getzep/graphiti.git
          git fetch --quiet upstream main
          git fetch --quiet origin main
          UP=$(git rev-parse upstream/main)
          TIP=$(git rev-parse origin/main)
          BASE=$(git merge-base "$UP" "$TIP")
          if [ "$UP" = "$BASE" ]; then
            echo "status=contained" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if TREE=$(git merge-tree --write-tree "$TIP" "$UP"); then
            echo "status=clean-behind" >> "$GITHUB_OUTPUT"; exit 0
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git merge-tree --write-tree --name-only "$TIP" "$UP" | sed -n '/^CONFLICT/,$p' | head -8 > /tmp/conflicts.txt || true
            exit 1
          fi
      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'ops: upstream/main has conflicts with main (PR #1209)'
        run: |
          BODY="Hourly check found conflicts between upstream/main and our PR branch.
          Upstream head: $(git rev-parse upstream/main)
          Conflicting files:
          \`\`\`
          $(cat /tmp/conflicts.txt 2>/dev/null || echo 'see run logs')
          \`\`\`
          Rebase needed. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ISSUE=$(gh issue list --search "in:title $TITLE" --state open --json number --jq '.[0].number' || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "Still conflicting (or new conflicts). $BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
